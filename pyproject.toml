[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walscope"
version = "0.1.0"
description = "SQLite binary header, Write-Ahead Log (WAL) frame, schema index, and query plan X-Ray inspector."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Dharmogata", email = "spectacle2002@gmail.com" }
]
keywords = ["sqlite", "wal", "database", "inspector", "binary-parser", "query-plan", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Dharmogata/walscope"
Issues = "https://github.com/Dharmogata/walscope/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "coverage>=7",
    "ruff>=0.9",
]

[project.scripts]
walscope = "walscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
